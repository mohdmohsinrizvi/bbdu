<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — BBDU CSE Study Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #f8f7f4;
      color: #1a1816;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #0f0e0d; color: #f5f5f4; }
    }
    .container {
      text-align: center;
      max-width: 380px;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #1e1b4b, #272247);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(30, 27, 75, 0.2);
    }
    .icon-wrapper svg {
      width: 36px;
      height: 36px;
      color: white;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #78716c;
      font-size: 0.9rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    @media (prefers-color-scheme: dark) {
      p { color: #a8a29e; }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      background: #4338ca;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s;
    }
    .btn:hover {
      background: #3730a3;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .offline-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.375rem 0.75rem;
      background: rgba(239, 68, 68, 0.1);
      color: #ef4444;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .offline-badge::before {
      content: '';
      width: 6px;
      height: 6px;
      background: #ef4444;
      border-radius: 50%;
    }
    .tips {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e7e5e4;
      text-align: left;
    }
    @media (prefers-color-scheme: dark) {
      .tips { border-top-color: #2a2826; }
    }
    .tips h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #78716c;
      margin-bottom: 0.75rem;
    }
    @media (prefers-color-scheme: dark) {
      .tips h3 { color: #a8a29e; }
    }
    .tips ul {
      list-style: none;
      font-size: 0.8rem;
      color: #78716c;
    }
    @media (prefers-color-scheme: dark) {
      .tips ul { color: #a8a29e; }
    }
    .tips li {
      padding: 0.375rem 0;
      padding-left: 1rem;
      position: relative;
    }
    .tips li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      background: #4338ca;
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/>
      </svg>
    </div>
    <div class="offline-badge">You're offline</div>
    <h1>No internet connection</h1>
    <p>Your saved study content is still available. Check your connection and try again.</p>
    <a href="/" class="btn" id="retryBtn">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      Try Again
    </a>
    <div class="tips">
      <h3>While offline you can</h3>
      <ul>
        <li>Browse previously visited pages</li>
        <li>View your saved progress</li>
        <li>Read cached study content</li>
      </ul>
    </div>
  </div>
  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      window.location.href = '/';
    });
  </script>
</body>
</html>
